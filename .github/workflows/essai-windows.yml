# Essai Windows de bout en bout (28/09/2026) : sur une vraie machine Windows jetable,
# l'application empaquetée (win-unpacked\Helix.exe) fait le parcours d'une personne :
# compte administrateur, moteur de LM Studio, modèle local, une question au Chat.
# Le pilotage est dans scripts/essai-windows-ci.mjs (mode d'emploi en tête) ; les journaux
# (passerelle.log, sortie de l'application, dossier de LM Studio) sont gardés en artefact,
# que l'essai passe ou non. Avant chaque publication, cet essai doit être vert (docs/GUIDE.md).
# Depuis le 29/09/2026, il garde aussi le flux brut de la réflexion du modèle (moteur seul, relais
# et Chat de Helix, scripts/essai-reflexion-ci.mjs), et le même essai tourne sous Linux (llmster).
name: Essai Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "electron/**"
      - "src/**"
      # La commande helix (04/10/2026) : l'étape 7 de l'essai la met en place et la lance.
      - "cli/**"
      - "package.json"
      - "scripts/essai-windows-ci.mjs"
      - "scripts/essai-reflexion-ci.mjs"
      - ".github/workflows/essai-windows.yml"

permissions:
  contents: read

# Un essai à la fois par branche : le suivant attend, il n'annule pas celui en cours.
concurrency:
  group: essai-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parcours:
    name: Parcours d'une personne sous Windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      # Fins de ligne telles qu'au dépôt, comme sur la machine qui fabrique les versions.
      - name: Fins de ligne du dépôt
        run: git config --global core.autocrlf false

      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Construire l'interface et la passerelle
        run: npm run build

      - name: Empaqueter l'application Windows (dossier, sans signature ni publication)
        env:
          # Pas de clé d'éditeur sur cette machine : l'application d'essai garde « Télécharger » pour ses mises à jour.
          HELIX_SANS_CLE_EDITEUR: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win dir --x64 --publish never

      - name: Parcours d'une personne (application empaquetée)
        env:
          HELIX_ESSAI_MACHINE_JETABLE: "1"
        run: node scripts/essai-windows-ci.mjs --app release/win-unpacked/Helix.exe --modele qwen3-1.7b --sortie essai-windows-sortie --delai-minutes 45

      - name: Garder les journaux
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: essai-windows-journaux
          path: essai-windows-sortie
          if-no-files-found: warn
          retention-days: 14

  # La réflexion du modèle sous Linux (29/09/2026) : la passerelle seule (node gateway/src),
  # le moteur sans interface de LM Studio (llmster) posé par elle, et les mêmes flux gardés.
  code-linux:
    name: Session de l'écran Code sous Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # La passerelle importe le SDK MCP (gateway/src/mcp.ts) : sans lui elle ne démarre pas (vu le 02/10/2026). OpenCode, lui, est celui que Helix pose.
      - name: Dépendances
        run: npm ci

      - name: Une session Code, comme l'écran l'ouvre (vrai OpenCode, faux moteur)
        run: node scripts/essai-code-ci.mjs --sortie essai-code-sortie

      - name: Garder le journal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: essai-code-linux
          path: essai-code-sortie
          if-no-files-found: warn
          retention-days: 14

  reflexion-linux:
    name: Réflexion du modèle sous Linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Réflexion du modèle (moteur seul, relais et Chat de Helix)
        env:
          HELIX_ESSAI_MACHINE_JETABLE: "1"
        run: node scripts/essai-reflexion-ci.mjs --modeles qwen3-1.7b,qwen/qwen3.5-2b --sortie essai-reflexion-sortie

      - name: Garder les flux et les journaux
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: essai-reflexion-linux
          path: essai-reflexion-sortie
          if-no-files-found: warn
          retention-days: 14
